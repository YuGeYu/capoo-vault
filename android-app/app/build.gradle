import java.util.Properties
import java.io.FileInputStream

plugins {
    id 'com.android.application'
}

// Load signing config from keystore.properties if present (never committed).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'xyz.maomaochongmiao.app'
    compileSdk 35

    defaultConfig {
        applicationId "xyz.maomaochongmiao.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        // Limit packaged native ABIs is irrelevant here (no native libs),
        // but keep resource configs lean.
        resourceConfigurations += ['zh', 'en']
    }

    buildFeatures {
        // Needed for BuildConfig.DEBUG check in MainActivity.
        buildConfig true
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No dependencies => no androidx/appcompat => minimal APK.
    dependencies {
    }
}
