name = "maomaochongtz-admin"
main = "src/worker.js"
compatibility_date = "2026-03-21"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "MMC_DB"
database_name = "your-d1-database-name"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MMC_MEDIA"
bucket_name = "your-r2-bucket-name"
preview_bucket_name = "your-r2-preview-bucket-name"

[vars]
SITE_NAME = "猫猫虫咖波表情包仓库"
SITE_ORIGIN = "https://your-domain.example"
ALLOW_PUBLIC_REGISTRATION = "true"
ALIPAY_APP_ID = "your-alipay-app-id"
ALIPAY_RETURN_URL = "https://your-domain.example/tools/remove-bg"
ALIPAY_NOTIFY_URL = "https://your-domain.example/api/billing/alipay/notify"
REMOVE_BG_MEMBER_SUBJECT = "AI抠图会员月卡"
REMOVE_BG_MEMBER_PRICE = "6.00"
REMOVE_BG_MEMBER_DURATION_DAYS = "30"
REMOVE_BG_MEMBER_SHOP_URL = "https://your-shop.example/product/remove-bg-member"

[[routes]]
pattern = "your-domain.example"
custom_domain = true
