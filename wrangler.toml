name = "maomaochongtz-admin"
main = "src/worker.js"
compatibility_date = "2026-03-21"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "MMC_DB"
database_name = "maomaochongtz-db"
database_id = "1e4db5cf-95cf-43ea-8035-e7621d3ab56b"

[[r2_buckets]]
binding = "MMC_MEDIA"
bucket_name = "mmc-r2"
preview_bucket_name = "mmc-r2"

[vars]
SITE_NAME = "猫猫虫咖波表情包仓库"
SITE_ORIGIN = "https://maomaochongmiao.600318.xyz"
ALLOW_PUBLIC_REGISTRATION = "true"
ALIPAY_APP_ID = "2021006146634110"
ALIPAY_RETURN_URL = "https://maomaochongmiao.600318.xyz/tools/remove-bg"
ALIPAY_NOTIFY_URL = "https://maomaochongmiao.600318.xyz/api/billing/alipay/notify"
REMOVE_BG_MEMBER_SUBJECT = "AI抠图会员月卡"
REMOVE_BG_MEMBER_PRICE = "6.00"
REMOVE_BG_MEMBER_DURATION_DAYS = "30"
REMOVE_BG_MEMBER_SHOP_URL = "https://pay.ldxp.cn/shop/lbtvjbtv"

[[routes]]
pattern = "maomaochongmiao.600318.xyz"
custom_domain = true
